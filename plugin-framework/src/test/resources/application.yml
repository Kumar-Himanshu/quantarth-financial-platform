spring:
  application:
    name: plugin-framework-test
  datasource:
    url: jdbc:h2:mem:fip_plugins_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
