name: QuantArth FIP CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  JWT_SECRET: "ci_test_jwt_secret_quantarth_fip_minimum_64_characters_super_secure"
  GATEWAY_INTERNAL_SECRET: "ci_test_internal_mesh_secret_2026_min_32_characters"

jobs:
  # ===========================================================================
  # 1. Java Multi-Module Build & Unit Tests
  # ===========================================================================
  java-unit-tests:
    name: Java Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Java Modules
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Execute Java Unit Tests
        run: ./gradlew test --no-daemon

      - name: Upload Java Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
          retention-days: 14

  # ===========================================================================
  # 2. Python FastAPI Tests (AI Service)
  # ===========================================================================
  python-fastapi-tests:
    name: Python FastAPI AI Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Tests
        working-directory: ai-service
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --junitxml=pytest-results.xml tests/

      - name: Upload Python Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-reports
          path: ai-service/pytest-results.xml
          retention-days: 14

  # ===========================================================================
  # 3. Real Infrastructure Integration Tests (PostgreSQL 16 & RabbitMQ 3.13)
  # ===========================================================================
  infrastructure-integration-tests:
    name: Infrastructure Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ java-unit-tests ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Docker Daemon Availability
        run: docker info

      - name: Execute Infrastructure Integration Tests
        run: ./gradlew integrationTest --no-daemon --info --stacktrace

      - name: Print Failing Test Summaries
        if: failure()
        run: |
          echo "================================================================="
          echo "INTEGRATION TEST FAILURE DIAGNOSTICS"
          echo "================================================================="
          find . -name "*.xml" -path "*/build/test-results/integrationTest/*" | while read -r file; do
            if grep -q '<failure' "$file"; then
              echo "--- Failing Test Suite: $file ---"
              grep -E '<testcase|<failure' "$file"
            fi
          done

      - name: Upload Integration Test Reports (HTML & XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-integration-test-reports
          path: |
            **/build/reports/tests/integrationTest/
            **/build/test-results/integrationTest/
          retention-days: 14
